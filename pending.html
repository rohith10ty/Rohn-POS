<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rohn POS - Pending Payments</title>
    <link rel="icon" type="image/png" href="cash-register.png">
    <link rel="apple-touch-icon" href="cash-register.png">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #4a4a4a;
            color: white;
        }
        .container-fluid {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .row {
            display: flex;
            flex-grow: 1;
        }
        .left-panel {
            width: 40%;
            background-color: #555;
            display: flex;
            flex-direction: column;
        }
        .transactions {
            display: flex;
            justify-content: space-around;
            padding: 10px;
        }
        .transactions button {
            flex: 1;
            margin: 0 5px;
            padding: 10px;
            font-size: 16px;
        }
        .datetime {
            text-align: center;
            padding: 10px;
            background: #666;
        }
        .item-list {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .scroll-btns {
            display: flex;
            justify-content: center;
            padding: 10px;
        }
        .scroll-btns button {
            margin: 0 5px;
            font-size: 20px;
            padding: 10px;
        }
        .right-panel {
            width: 60%;
            background-color: #888;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background: #999;
        }
        .pending-items-list {
            padding: 10px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .pending-items-list .item-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .footer-buttons {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
        }
        .footer-buttons button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #e0e0e0;
            color: #333;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            display: flex; /* Added for icon alignment */
            align-items: center; /* Vertically center icon and text */
        }

        .footer-buttons button:hover {
            background-color: #333;
            color: #e0e0e0;
        }

        .footer-buttons button img {
            margin-right: 5px; /* Add some space between icon and text */
            height: 24px; /* Adjust as needed */
            width: 24px;  /* Adjust as needed */
        }

        /* Added or modified for pending page */
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ccc;
        }
        .item-row span {
            width: 20%;
            word-wrap: break-word;
        }
        .item-row .items-list {
            width: 40%;
        }
        .item-row button {
            width: 10%;
            padding: 5px;
            font-size: 12px;
        }
        .item-header span{
            width: 20%;
            word-wrap: break-word;
        }
        .item-header span:nth-child(2){
            width: 40%;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pending-page">
    <div class="container-fluid h-100">
        <div class="row h-100">
            <div class="col-md-4 left-panel d-flex flex-column">
                <div class="transactions d-flex justify-content-around p-2">
                    <button class="btn btn-secondary flex-grow-1 mr-1">Transaction 1</button>
                    <button class="btn btn-secondary flex-grow-1 mr-1">Transaction 2</button>
                    <button class="btn btn-secondary flex-grow-1">Transaction 3</button>
                </div>
                <div class="datetime bg-secondary text-center p-2"></div>
                <div class="item-list pending-help p-2 overflow-auto flex-grow-1">
                    <p>Select the destination transaction above, then use <strong>Clear</strong> beside a pending payment to restore its items.</p>
                </div>
                <div class="scroll-btns d-flex justify-content-center p-2">
                    <button class="btn btn-outline-light mr-1">&uarr;</button>
                    <button class="btn btn-outline-light">&darr;</button>
                </div>
            </div>

            <div class="col-md-8 right-panel d-flex flex-column justify-content-between">
                <div class="info-bar bg-light text-dark d-flex justify-content-between p-2">
                    <div>Count: <span id="item-count-info">00</span> Total: <span id="total-amount-info">0.00</span></div>
                    <div>
                        Change: <span id="change-amount-info">£0.00</span> &nbsp; | &nbsp; Paid: <span id="paid-amount-info">£0.00</span>
                    </div>
                </div>
                <div class="pending-items-list p-2 overflow-auto flex-grow-1">
                    <div class="item-header d-flex justify-content-between font-weight-bold mb-2">
                        <span>Timestamp</span>
                        <span>Items</span>
                        <span>Total</span>
                        <span>Action</span>
                    </div>
                </div>
                <div class="footer-buttons bg-secondary d-flex justify-content-between p-2">
                    <button id="home-btn" onclick="window.location.href='index.html'" class="btn btn-light">
                        <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/home.svg" alt="Home">
                        Home
                    </button>
                    <button id="print-receipt" class="btn btn-light">
                        <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/printer.svg" alt="Print Receipt">
                        Print Receipt
                    </button>
                    <button class="btn btn-outline-light" onclick="goBack()">
                        <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/arrow-left.svg" alt="Back">
                        Back
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const storedPendingTarget = Number(localStorage.getItem('pos_current_transaction'));
        let pendingTargetTransaction = [1, 2, 3].includes(storedPendingTarget) ? storedPendingTarget : 1;

        function loadPendingTransactions() {
            const data = localStorage.getItem('pos_pending');
            return data ? JSON.parse(data) : [];
        }

        function clearPendingTransaction(index) {
            let pendingTransactions = loadPendingTransactions();
            const transactionToClear = pendingTransactions[index];

            // Remove the transaction from the pending list
            pendingTransactions.splice(index, 1);
            localStorage.setItem('pos_pending', JSON.stringify(pendingTransactions));
            renderPendingTransactions(); // Re-render in pending.html

            // Get the current transactions
            let transactions = JSON.parse(localStorage.getItem('pos_transactions') || '{"1":[],"2":[],"3":[]}');

            // Restore the pending line items into the selected transaction.
            if (!transactions[pendingTargetTransaction]) {
                transactions[pendingTargetTransaction] = [];
            }
            transactions[pendingTargetTransaction].push(...transactionToClear.items);
            localStorage.setItem('pos_transactions', JSON.stringify(transactions));
            window.location.href = 'index.html';
        }

        function renderPendingTransactions() {
            const pendingTransactions = loadPendingTransactions();
            const itemList = document.querySelector('.pending-items-list');
            itemList.innerHTML = `
                <div class="item-header d-flex justify-content-between font-weight-bold mb-2">
                    <span>Timestamp</span>
                    <span>Items</span>
                    <span>Total</span>
                    <span>Action</span>
                </div>
            `;

            pendingTransactions.forEach((transaction, index) => {
                const row = document.createElement('div');
                row.classList.add('item-row');

                const formattedTimestamp = transaction.timestamp;

                let itemsHTML = '<ul style="list-style-position: inside; padding-left: 0px;">';
                transaction.items.forEach(item => {
                    itemsHTML += `<li>${item.name} (Qty: ${item.qty}, Total: £${item.total.toFixed(2)})</li>`;
                });
                itemsHTML += '</ul>';

                row.innerHTML = `
                    <span>${formattedTimestamp}</span>
                    <span class="items-list">${itemsHTML}</span>
                    <span>£${transaction.total.toFixed(2)}</span>
                    <button class="btn btn-danger btn-sm" onclick="clearPendingTransaction(${index})">Clear</button>
                `;
                itemList.appendChild(row);
            });

            const pendingTotal = pendingTransactions.reduce((sum, transaction) => sum + (Number(transaction.total) || 0), 0);
            document.getElementById('item-count-info').textContent = pendingTransactions.length;
            document.getElementById('total-amount-info').textContent = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' }).format(pendingTotal);
        }

        function updateDateTime() {
            const now = new Date();
            const dateTimeString = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString('en-GB');
            document.querySelector('.datetime').textContent = dateTimeString;
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.transactions button').forEach((button, index) => {
                button.addEventListener('click', () => {
                    pendingTargetTransaction = index + 1;
                    localStorage.setItem('pos_current_transaction', String(pendingTargetTransaction));
                    document.querySelectorAll('.transactions button').forEach((item, itemIndex) => {
                        const active = itemIndex === index;
                        item.classList.toggle('active', active);
                        item.setAttribute('aria-pressed', String(active));
                    });
                });
            });
            document.querySelectorAll('.transactions button').forEach((button, index) => {
                const active = index + 1 === pendingTargetTransaction;
                button.classList.toggle('active', active);
                button.setAttribute('aria-pressed', String(active));
            });
            renderPendingTransactions();
        });
    </script>
    <script>
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
